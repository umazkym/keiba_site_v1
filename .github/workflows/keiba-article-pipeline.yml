name: Keiba Article Auto Pipeline

on:
  schedule:
    # 火曜・土曜 08:00 JST (UTCでは月・金の23:00)
    # ★ Neon Free Tier Network Transfer 削減 (2026-04-11)
    #   毎日→週2回に変更。egress 月2.4GB削減。
    #   火曜: 統計記事 (data_scientist.py) の生成
    #   土曜: 重賞プレビュー記事の生成（金曜に予測データ生成済み）
    - cron: '0 23 * * 1,5'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME || 'github-actions[bot]' }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

      - name: Step 1A - Generate Grade Race Write Orders
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/agents/grade_race_writer.py || echo "重賞WriteOrder生成スキップ（エラーでも続行）"

      - name: Step 1B - Generate Statistical Write Order (Data Scientist)
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/agents/data_scientist.py

      - name: Step 2 & 3 - Generate Draft and Review
        working-directory: ./frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/agents/test_pipeline.ts

      - name: Check if article was approved
        id: check_approved
        run: |
          approved=$(find frontend/agents/queue/approved -name "*.md" 2>/dev/null | wc -l)
          echo "approved_count=$approved" >> $GITHUB_OUTPUT

      - name: Step 4 - Publish and Push
        if: steps.check_approved.outputs.approved_count > 0
        working-directory: ./frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/agents/agent_publisher.ts

      - name: Step 5 - Completion Check
        run: echo "Pipeline execution completed successfully!"
