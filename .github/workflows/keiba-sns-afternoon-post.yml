name: Keiba SNS Afternoon Post

on:
  schedule:
    # 毎日 UTC 03:00 = JST 12:00
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sns-post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          
      - name: Post to SNS (Afternoon)
        working-directory: backend
        env:
          PYTHONPATH: .
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_EXPIRY: ${{ secrets.THREADS_TOKEN_EXPIRY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ENABLE_TWITTER: 'true'
          ENABLE_THREADS: 'true'
          FAIL_ON_SNS_ERROR: 'true'
          ALLOW_X_TRANSIENT_FAILURE_WITH_THREADS: 'true'
          TWITTER_POST_MAX_RETRIES: '3'
          TWITTER_POST_RETRY_BASE_SECONDS: '30'
          TZ: Asia/Tokyo
          RENDER: 'false'
        run: |
          python scripts/sns_poster.py --post-type afternoon
