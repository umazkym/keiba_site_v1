name: Keiba SNS Hit Immediate Post
run-name: ${{ inputs.trigger == 'cloudflare' && format('{0} (定時)', github.workflow) || github.workflow }}

on:
  schedule:
    - cron: '0 10 * * 0,6'
  workflow_dispatch:
    inputs:
      trigger:
        description: '起動元（Cloudflare の定時起動は cloudflare。手で動かすときは空のまま）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

# 予定の回と定時の起動は1本ずつ（関所が相手の結果を見られるように）。手で動かす回は並べてよい
concurrency:
  group: keiba-sns-hit-immediate-${{ (github.event_name == 'schedule' || inputs.trigger == 'cloudflare') && 'slot' || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    # Cloudflare の定時起動（予定どおり）と GitHub の予定（おくれる・予備）が二重に動かないようにする（2026-10-25）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: backend/scripts/maintenance/workflow_dispatch_gate.py
          sparse-checkout-cone-mode: false

      - name: Check the on-time slot
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_TRIGGER: ${{ inputs.trigger }}
        run: python3 backend/scripts/maintenance/workflow_dispatch_gate.py

  fetch-results-and-post:
    needs: gate
    # 関所が「止める」と言ったときだけ止める（関所が動けなかった日は出し損ねないように動かす）
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Step 1 - Fetch Today Results
        working-directory: backend
        env:
          PYTHONPATH: .
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RACE_BATCH_SIZE: '3'
          SELENIUM_PAGE_LOAD_TIMEOUT: '40'
          SELENIUM_ELEMENT_WAIT_TIMEOUT: '20'
          TZ: Asia/Tokyo
        run: python run_pipeline.py --date today --mode RESULTS_ONLY

      - name: Step 2 - Post Immediate Hit Report
        working-directory: backend
        env:
          PYTHONPATH: .
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_EXPIRY: ${{ secrets.THREADS_TOKEN_EXPIRY }}
          SNS_THREADS_IMAGE_MODE: ${{ vars.SNS_THREADS_IMAGE_MODE || 'off' }}
          # 画像つきの投稿に付ける返信の数（つかみの一言とレースのページ。1回の実行で最初のN本まで。0で止める）
          SNS_THREADS_LINK_REPLY_MAX_PER_RUN: ${{ vars.SNS_THREADS_LINK_REPLY_MAX_PER_RUN || '1' }}
          SOCIAL_VIDEO_STAGING_GCS_BUCKET: ${{ vars.SOCIAL_VIDEO_STAGING_GCS_BUCKET }}
          SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT: ${{ vars.SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ENABLE_TWITTER: ${{ vars.SNS_ENABLE_X || 'false' }}
          ENABLE_THREADS: 'true'
          FAIL_ON_SNS_ERROR: 'true'
          ALLOW_X_TRANSIENT_FAILURE_WITH_THREADS: 'true'
          TWITTER_POST_MAX_RETRIES: '3'
          TWITTER_POST_RETRY_BASE_SECONDS: '30'
          TZ: Asia/Tokyo
          RENDER: 'false'
        run: python scripts/sns_poster.py --post-type hit_immediate
