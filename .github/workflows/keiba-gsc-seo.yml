name: Keiba GSC Weekly SEO Audit

on:
  schedule:
    # 毎週水曜 09:15 JST（UTCでは水曜00:15）
    - cron: '15 0 * * 3'
  workflow_dispatch:
    inputs:
      article_slug:
        description: 'GSC改善候補に表示された正確な記事slug（1件のみ）'
        required: true
        type: string

concurrency:
  # 通常の記事生成・公開と同時にmainへ書き込まない。
  group: keiba-article-auto-pipeline
  cancel-in-progress: false

jobs:
  audit-and-optional-rewrite:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.resolve_published_release.outputs.published }}
      published_sha: ${{ steps.resolve_published_release.outputs.published_sha }}

    permissions:
      contents: write
      id-token: write

    env:
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:uma-free.com' }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      CLARITY_API_KEY: ${{ secrets.CLARITY_API_KEY }}
      GEMINI_EDITOR_MODEL_TIERS: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: keiba-api-project
          workload_identity_provider: projects/761440273070/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-iap-db@keiba-api-project.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Prepare Report Directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/gsc-seo"

      - name: Export Public Canonical Article Inventory
        working-directory: ./frontend
        run: npm run gsc:export-inventory -- --output "$RUNNER_TEMP/gsc-seo/article-inventory.json"

      - name: Analyze Finalized Search Console Data
        run: >-
          python backend/scripts/agents/gsc_seo_analyzer.py
          --inventory "$RUNNER_TEMP/gsc-seo/article-inventory.json"
          --output "$RUNNER_TEMP/gsc-seo/report.json"
          --summary "$RUNNER_TEMP/gsc-seo/summary.md"
          --site-url "$GSC_SITE_URL"

      - name: Collect GA4 Monetization Axes
        id: collect_ga4
        if: env.GA4_PROPERTY_ID != ''
        continue-on-error: true
        run: >-
          python backend/scripts/agents/data_value_funnel_report.py
          --days 28
          --output-json "$RUNNER_TEMP/gsc-seo/ga4-report.json"
          --summary "$RUNNER_TEMP/gsc-seo/ga4-summary.md"

      - name: Collect Clarity Read-only Pulse
        id: collect_clarity
        if: env.CLARITY_API_KEY != ''
        continue-on-error: true
        run: >-
          python backend/scripts/export_clarity_insights.py
          --profile pulse
          --num-days 3
          --output-dir "$RUNNER_TEMP/gsc-seo/clarity"

      - name: Build monetization-report.v1
        id: build_monetization_report
        if: always()
        continue-on-error: true
        run: >-
          python backend/scripts/agents/monetization_weekly_report.py
          --ga4-report "$RUNNER_TEMP/gsc-seo/ga4-report.json"
          --gsc-report "$RUNNER_TEMP/gsc-seo/report.json"
          --clarity-dir "$RUNNER_TEMP/gsc-seo/clarity"
          --output-json "$RUNNER_TEMP/gsc-seo/monetization-report.v1.json"
          --summary "$RUNNER_TEMP/gsc-seo/monetization-summary.md"

      - name: Add Audit to Actions Summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gsc-seo/summary.md" ]; then
            cat "$RUNNER_TEMP/gsc-seo/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/gsc-seo/monetization-summary.md" ]; then
            cat "$RUNNER_TEMP/gsc-seo/monetization-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "## 取得状態"
            echo "- GA4: ${{ steps.collect_ga4.outcome }}"
            echo "- Clarity: ${{ env.CLARITY_API_KEY != '' && steps.collect_clarity.outcome || '未設定' }}"
            echo "- monetization-report.v1: ${{ steps.build_monetization_report.outcome }}"
            echo "- 個別媒体の失敗時も取得済み原本をartifactへ保存します。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write Source Status
        if: always()
        shell: bash
        env:
          GA4_OUTCOME: ${{ steps.collect_ga4.outcome }}
          CLARITY_CONFIGURED: ${{ env.CLARITY_API_KEY != '' }}
          CLARITY_OUTCOME: ${{ steps.collect_clarity.outcome }}
          REPORT_OUTCOME: ${{ steps.build_monetization_report.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "gsc-seo" / "source-status.json"
          payload = {
              "ga4": os.environ.get("GA4_OUTCOME") or "skipped",
              "clarity": (
                  os.environ.get("CLARITY_OUTCOME") or "skipped"
                  if os.environ.get("CLARITY_CONFIGURED") == "true"
                  else "not_configured"
              ),
              "monetization_report": os.environ.get("REPORT_OUTCOME") or "skipped",
              "partial_artifact_policy": True,
          }
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload GSC Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-seo-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gsc-seo/report.json
            ${{ runner.temp }}/gsc-seo/summary.md
            ${{ runner.temp }}/gsc-seo/article-inventory.json
            ${{ runner.temp }}/gsc-seo/monetization-report.v1.json
            ${{ runner.temp }}/gsc-seo/monetization-summary.md
            ${{ runner.temp }}/gsc-seo/ga4-report.json
            ${{ runner.temp }}/gsc-seo/ga4-summary.md
            ${{ runner.temp }}/gsc-seo/clarity/**
            ${{ runner.temp }}/gsc-seo/source-status.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail After Preserving Partial Artifact
        if: always()
        shell: bash
        env:
          GA4_CONFIGURED: ${{ env.GA4_PROPERTY_ID != '' }}
          GA4_OUTCOME: ${{ steps.collect_ga4.outcome }}
          CLARITY_CONFIGURED: ${{ env.CLARITY_API_KEY != '' }}
          CLARITY_OUTCOME: ${{ steps.collect_clarity.outcome }}
          REPORT_OUTCOME: ${{ steps.build_monetization_report.outcome }}
        run: |
          failed=0
          if [ "$GA4_CONFIGURED" = "true" ] && [ "$GA4_OUTCOME" != "success" ]; then
            echo "::error::GA4取得に失敗しました。取得済み原本はartifactへ保存済みです。"
            failed=1
          fi
          if [ "$CLARITY_CONFIGURED" = "true" ] && [ "$CLARITY_OUTCOME" != "success" ]; then
            echo "::error::Clarity取得に失敗しました。取得済み原本はartifactへ保存済みです。"
            failed=1
          fi
          if [ "$REPORT_OUTCOME" != "success" ]; then
            echo "::error::monetization-report.v1生成に失敗しました。取得済み原本はartifactへ保存済みです。"
            failed=1
          fi
          exit "$failed"

      - name: Validate Manual Rewrite Input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ARTICLE_SLUG: ${{ inputs.article_slug }}
          TARGET_REF: ${{ github.ref }}
        run: |
          if [ "$TARGET_REF" != "refs/heads/main" ]; then
            echo "::error::GSC改稿はmainブランチからだけ実行できます。"
            exit 1
          fi
          if ! [[ "$ARTICLE_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,199}$ ]]; then
            echo "::error::article_slugは英小文字・数字・ハイフンだけで指定してください。"
            exit 1
          fi

      - name: Generate One Guarded GSC Rewrite
        if: github.event_name == 'workflow_dispatch'
        working-directory: ./frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTICLE_SLUG: ${{ inputs.article_slug }}
        run: >-
          npm run gsc:rewrite --
          --report "$RUNNER_TEMP/gsc-seo/report.json"
          --slug "$ARTICLE_SLUG"

      - name: Validate Rewrite Before Publish
        if: github.event_name == 'workflow_dispatch'
        working-directory: ./frontend
        run: |
          npm run gsc:test-rewrite
          npm run article:test-independence
          npm run article:validate-links
          npm run article:audit-quality
          npx tsc --noEmit

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME || 'github-actions[bot]' }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

      - name: Publish Exact Existing Article
        if: github.event_name == 'workflow_dispatch'
        working-directory: ./frontend
        env:
          ARTICLE_PUBLISH_OPERATION: gsc_rewrite
        run: npm run article:publish

      - name: Resolve published release
        id: resolve_published_release
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_SHA="$(git rev-parse HEAD)"
          if [[ "$PUBLISHED_SHA" == "$SOURCE_SHA" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "published_sha=" >> "$GITHUB_OUTPUT"
            echo "記事commitが作成されなかったためCloud Runデプロイを省略します。"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "published_sha=$PUBLISHED_SHA" >> "$GITHUB_OUTPUT"
            echo "Cloud Run反映対象SHA: $PUBLISHED_SHA"
          fi

  deploy-frontend:
    needs: audit-and-optional-rewrite
    if: ${{ needs.audit-and-optional-rewrite.outputs.published == 'true' && vars.CLOUD_RUN_FRONTEND_AUTO_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-frontend-cloud-run.yml
    with:
      source_ref: ${{ needs.audit-and-optional-rewrite.outputs.published_sha }}
      disable_default_url: true
    secrets: inherit
