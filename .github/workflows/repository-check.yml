name: Repository Structure Check

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'docs/**'
      - '*.py'
      - 'archive/**'
      - 'backend/**'
      - 'frontend/package*.json'
      - 'frontend/app/**'
      - 'frontend/scripts/**'
      - 'package.json'
      - 'pytest.ini'
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'docs/**'
      - '*.py'
      - 'archive/**'
      - 'backend/**'
      - 'frontend/package*.json'
      - 'frontend/app/**'
      - 'frontend/scripts/**'
      - 'package.json'
      - 'pytest.ini'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 構成検査の依存関係を準備
        run: npm ci --prefix frontend --ignore-scripts
      - name: 記事PublisherのGit差分判定を検証
        working-directory: frontend
        run: npm run article:test-publisher-git
      - name: 機能と実行経路とアーカイブを照合
        run: npm run repository:check
      - name: SOPの形式を検証
        run: node scripts/agent_sops/validate_sops.cjs
