name: Keiba YouTube Video Pipeline

on:
  schedule:
    # 毎日 UTC 08:17 = JST 17:17。19:00の同時公開まで生成・確認時間を確保する。
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日 YYYY-MM-DD。未指定なら翌日JST'
        required: false
        type: string
      dry_run:
        description: 'true の場合は生成だけ行い、YouTube投稿しない'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publication_mode:
        description: '投稿モード。通常の3日間検証はprivate_review'
        required: false
        default: 'private_review'
        type: choice
        options:
          - 'disabled'
          - 'private_review'
          - 'scheduled_public'

concurrency:
  group: keiba-youtube-video-${{ github.event.inputs.target_date || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Download licensed BGM from private storage
        env:
          SOCIAL_VIDEO_BGM_GCS_URI: gs://keiba-api-project-private-social-assets/audio/waiwai-music-time.mp3
        run: |
          set -euo pipefail
          mkdir -p backend/scripts/social_video/assets/audio/common
          gcloud storage cp "$SOCIAL_VIDEO_BGM_GCS_URI" \
            backend/scripts/social_video/assets/audio/common/わいわいミュージック・タイム.mp3

      - name: Validate social video assets
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/social_video/validate_assets.py --json-output ../youtube_video_dist/asset-validation.json

      - name: Generate and upload YouTube videos
        id: youtube_pipeline
        continue-on-error: true
        working-directory: backend
        env:
          PYTHONPATH: .
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_UPLOAD_ENABLED: ${{ secrets.YOUTUBE_UPLOAD_ENABLED }}
          YOUTUBE_PUBLICATION_MODE: ${{ github.event.inputs.publication_mode || vars.YOUTUBE_PUBLICATION_MODE || 'private_review' }}
          YOUTUBE_PUBLISH_TIME_JST: '19:00'
          YOUTUBE_PUBLISH_MIN_LEAD_MINUTES: ${{ vars.YOUTUBE_PUBLISH_MIN_LEAD_MINUTES || '20' }}
          YOUTUBE_MAX_PUBLISH_SHIFT_MINUTES: ${{ vars.YOUTUBE_MAX_PUBLISH_SHIFT_MINUTES || '240' }}
          YOUTUBE_MAX_SHORTS: '1'
          YOUTUBE_READINESS_ATTEMPTS: '3'
          YOUTUBE_READINESS_DELAY_SECONDS: '600'
          YOUTUBE_DAILY_QUOTA_BUDGET: ${{ vars.YOUTUBE_DAILY_QUOTA_BUDGET || '8000' }}
          SOCIAL_VIDEO_MOTION_PROFILE: 'standard'
          TZ: Asia/Tokyo
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --target-date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run --skip-upload"
          fi
          python scripts/youtube_video_pipeline.py --max-shorts 1 $EXTRA_ARGS

      - name: Distribute daily short to organic social platforms
        id: social_distribution
        if: always()
        continue-on-error: true
        working-directory: backend
        env:
          PYTHONPATH: .
          SOCIAL_VIDEO_THREADS_MODE: ${{ vars.SOCIAL_VIDEO_THREADS_MODE || 'validate' }}
          SOCIAL_VIDEO_INSTAGRAM_MODE: ${{ vars.SOCIAL_VIDEO_INSTAGRAM_MODE || 'validate' }}
          SOCIAL_VIDEO_FACEBOOK_MODE: ${{ vars.SOCIAL_VIDEO_FACEBOOK_MODE || 'validate' }}
          SOCIAL_VIDEO_TIKTOK_MODE: ${{ vars.SOCIAL_VIDEO_TIKTOK_MODE || 'validate' }}
          SOCIAL_VIDEO_PINTEREST_MODE: ${{ vars.SOCIAL_VIDEO_PINTEREST_MODE || 'validate' }}
          SOCIAL_VIDEO_BLUESKY_MODE: ${{ vars.SOCIAL_VIDEO_BLUESKY_MODE || 'validate' }}
          SOCIAL_VIDEO_STAGING_GCS_BUCKET: ${{ vars.SOCIAL_VIDEO_STAGING_GCS_BUCKET }}
          SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT: ${{ vars.SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_AUTO_PUBLISH_CONSENT: ${{ vars.TIKTOK_AUTO_PUBLISH_CONSENT || 'false' }}
          TIKTOK_APP_AUDITED: ${{ vars.TIKTOK_APP_AUDITED || 'false' }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TZ: Asia/Tokyo
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --target-date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-validate"
          fi
          python scripts/social_video_distribution.py $EXTRA_ARGS

      - name: Verify distribution outcomes
        if: always()
        env:
          YOUTUBE_OUTCOME: ${{ steps.youtube_pipeline.outcome }}
          SOCIAL_OUTCOME: ${{ steps.social_distribution.outcome }}
        run: |
          if [ "$YOUTUBE_OUTCOME" != "success" ]; then
            echo "YouTube生成・投稿処理が失敗しました。"
            exit 1
          fi
          if [ "$SOCIAL_OUTCOME" != "success" ]; then
            echo "SNS動画配信処理が失敗しました。"
            exit 1
          fi

      - name: Upload social video validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-validation-${{ github.run_id }}
          path: |
            youtube_video_dist/**/asset-validation.json
            youtube_video_dist/**/summary.json
            youtube_video_dist/**/social-distribution-summary.json
            youtube_video_dist/**/thumbnail.jpg
            youtube_video_dist/**/thumbnail_246x138.png
            youtube_video_dist/**/design-contact-sheet.png
            youtube_video_dist/**/shorts-ui-overlay.png
            youtube_video_dist/**/motion-review/*.mp4
          if-no-files-found: warn
          retention-days: 7
