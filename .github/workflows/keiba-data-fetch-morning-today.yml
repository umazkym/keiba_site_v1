name: Keiba Data Fetch (Morning Today)

on:
  schedule:
    # 地方競馬と祝日開催を含む当日データを毎朝確認する。
    # JST 06:30 = UTC 21:30 (前日)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 初回やDBデータ不足時に全件取得（約85分）が走る可能性があるため120分に設定

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Run pipeline (Today Predictions)
        working-directory: backend
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RACE_BATCH_SIZE: '3'
          SELENIUM_PAGE_LOAD_TIMEOUT: '40'
          SELENIUM_ELEMENT_WAIT_TIMEOUT: '20'
          TZ: Asia/Tokyo
        run: |
          python run_pipeline.py --date today --mode PREDICTIONS_ONLY
