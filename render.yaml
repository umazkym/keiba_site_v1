services:
  # サービス1: データ生成パイプライン (毎日 JST AM 5:00 実行)
  - type: cron
    name: keiba-pipeline-runner
    runtime: docker
    region: oregon
    schedule: "0 20 * * *"  # JST AM 5:00
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: PIPELINE_MODE
        value: PRODUCTION
      - key: TZ
        value: Asia/Tokyo
      - key: API_BASE_URL
        value: "https://keiba-site-v1.onrender.com"
      - key: WEBHOOK_URL
        sync: false
      # Render環境であることを示す環境変数を追加
      - key: RENDER
        value: "true"

  # サービス2: SNS投稿 (毎日 JST AM 7:00 実行)  
  - type: cron
    name: keiba-sns-poster
    runtime: docker
    region: oregon
    schedule: "0 22 * * *" # JST AM 7:00
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python scripts/sns_poster.py"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TZ
        value: Asia/Tokyo
      - key: API_BASE_URL
        value: "https://keiba-site-v1.onrender.com"
      - key: TWITTER_CONSUMER_KEY
        sync: false
      - key: TWITTER_CONSUMER_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false
      - key: WEBHOOK_URL
        sync: false
      # Render環境であることを示す環境変数を追加
      - key: RENDER
        value: "true"