services:
  # SNS投稿ジョブ①: 朝7時（的中報告 + 本命馬成績）
  - type: cron
    name: keiba-sns-morning-post
    runtime: docker
    region: oregon
    plan: starter  # 512MB RAM (SNS投稿用)
    schedule: "0 22 * * *"  # JST AM 7:00
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python scripts/sns_poster.py --post-type morning"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TZ
        value: Asia/Tokyo
      - key: API_BASE_URL
        value: "https://keiba-site-v1.onrender.com"
      - key: TWITTER_CONSUMER_KEY
        sync: false
      - key: TWITTER_CONSUMER_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false
      - key: RENDER
        value: "true"
      - key: INSTANCE_ID
        generateValue: true

  # SNS投稿ジョブ②: 昼12時（本日のレース一覧 + AI的中ランキング）
  - type: cron
    name: keiba-sns-afternoon-post
    runtime: docker
    region: oregon
    plan: starter  # 512MB RAM (SNS投稿用)
    schedule: "0 3 * * *"  # JST PM 12:00
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python scripts/sns_poster.py --post-type afternoon"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TZ
        value: Asia/Tokyo
      - key: API_BASE_URL
        value: "https://keiba-site-v1.onrender.com"
      - key: TWITTER_CONSUMER_KEY
        sync: false
      - key: TWITTER_CONSUMER_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false
      - key: RENDER
        value: "true"
      - key: INSTANCE_ID
        generateValue: true

  # SNS投稿ジョブ③: 夜20時（明日の重賞/注目レース分析）
  - type: cron
    name: keiba-sns-evening-post
    runtime: docker
    region: oregon
    plan: starter  # 512MB RAM (SNS投稿用)
    schedule: "0 11 * * *"  # JST PM 8:00
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python scripts/sns_poster.py --post-type evening"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TZ
        value: Asia/Tokyo
      - key: API_BASE_URL
        value: "https://keiba-site-v1.onrender.com"
      - key: TWITTER_CONSUMER_KEY
        sync: false
      - key: TWITTER_CONSUMER_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false
      - key: RENDER
        value: "true"
      - key: INSTANCE_ID
        generateValue: true

  # データ取得ジョブ（午後）: 13:30（翌日のレース情報取得 - JRA対応）
  - type: cron
    name: keiba-data-fetch-afternoon
    runtime: docker
    region: oregon
    plan: starter  # 512MB RAM
    schedule: "30 4 * * *"  # JST PM 1:30 (UTC 04:30)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python run_pipeline.py --date tomorrow --mode PREDICTIONS_ONLY"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TZ
        value: Asia/Tokyo
      - key: RENDER
        value: "true"
      - key: INSTANCE_ID
        generateValue: true
      - key: WEBHOOK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RACE_BATCH_SIZE
        value: "15"
      - key: SELENIUM_PAGE_LOAD_TIMEOUT
        value: "40"
      - key: SELENIUM_ELEMENT_WAIT_TIMEOUT
        value: "20"

  # データ取得ジョブ（朝）: 朝6:30（当日レース予測生成・更新）
  - type: cron
    name: keiba-data-fetch-morning-today
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 21 * * *"  # JST AM 6:00 (UTC 21:00 - 前日)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python run_pipeline.py --date today --mode PREDICTIONS_ONLY"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TZ
        value: Asia/Tokyo
      - key: RENDER
        value: "true"
      - key: INSTANCE_ID
        generateValue: true
      - key: WEBHOOK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RACE_BATCH_SIZE
        value: "15"
      - key: SELENIUM_PAGE_LOAD_TIMEOUT
        value: "40"
      - key: SELENIUM_ELEMENT_WAIT_TIMEOUT
        value: "20"

  # SNS自動投稿ジョブ（直前リマインド）: 土日 14:00 JST (UTC 5:00)
  - type: cron
    name: keiba-sns-pre-race
    runtime: docker
    region: oregon
    plan: free
    schedule: "0 5 * * 0,6"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python scripts/sns_poster.py --post-type pre_race"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TWITTER_CONSUMER_KEY
        sync: false
      - key: TWITTER_CONSUMER_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false
      - key: API_BASE_URL
        value: https://keiba-site-v1-api.onrender.com
      - key: SITE_BASE_URL
        value: https://k-b-a.vercel.app/

  # パイプライン実行ジョブ: 朝5時（前日の結果取得のみ）
  - type: cron
    name: keiba-pipeline-runner
    runtime: docker
    region: oregon
    plan: starter  # 512MB RAM (starterプラン)
    schedule: "0 20 * * *"  # JST AM 5:00 (UTC 20:00)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "python run_pipeline.py --date yesterday --mode RESULTS_ONLY"
    envVars:
      - key: DATABASE_URL
        value: postgresql://keiba_db_user:XTme6b9rg87c6POChTgQlBFgV0NQJV8a@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db
      - key: TZ
        value: Asia/Tokyo
      - key: RENDER
        value: "true"
      - key: INSTANCE_ID
        generateValue: true
      - key: WEBHOOK_URL
        sync: false
      - key: RACE_BATCH_SIZE
        value: "15"
      - key: SELENIUM_PAGE_LOAD_TIMEOUT
        value: "40"
      - key: SELENIUM_ELEMENT_WAIT_TIMEOUT
        value: "20"
