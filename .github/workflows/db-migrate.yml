name: Database Migration (Render to Neon)

on: workflow_dispatch

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
      - name: Dump Data from Render
        env:
          SOURCE_DB: "postgresql://keiba_database_user:kRhHHHeIdx5Pw9LzkbA8HCLLKAg20XDm@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db"
        run: |
          echo "Starting pg_dump from Render..."
          # PGPASSWORDはURLにあるので不要だが念のため
          pg_dump --no-owner --no-privileges --clean --if-exists -d $SOURCE_DB > dump.sql
          ls -lh dump.sql
          head -n 20 dump.sql
          
      - name: Restore Data to Neon
        env:
          TARGET_DB: "postgresql://neondb_owner:npg_0kOPvcxAU4bg@ep-hidden-fog-aksj4thi.c-3.us-west-2.aws.neon.tech/neondb?sslmode=require"
        run: |
          echo "Starting psql restore to Neon..."
          psql -d $TARGET_DB -f dump.sql > restore.log 2>&1 || cat restore.log
          echo "Checking tables..."
          psql -d $TARGET_DB -c "\dt"
