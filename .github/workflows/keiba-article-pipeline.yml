name: Keiba Article Auto Pipeline

on:
  schedule:
    # 毎日 08:00 JST (UTCでは前日の23:00)
    # GCE移行完了 (2026-04-12): 帯域制限解消のため毎日実行に復元
    - cron: '0 23 * * *'
    # 中央重賞の枠順確定後・地方重賞2日前チェック: 毎日 11:45 JST
    - cron: '45 2 * * *'
    # 中央重賞の結果反映後チェック: 毎日 16:45 JST
    - cron: '45 7 * * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'この実行で生成・公開する最大記事数'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      run_quality_audit:
        description: '公開済み記事の品質監査を実行する'
        required: true
        default: true
        type: boolean
      run_grade_race_search_repair:
        description: '確定済みGSCデータから重賞検索急落の安全な救済を実行する'
        required: true
        default: false
        type: boolean

concurrency:
  group: keiba-article-auto-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.resolve_published_release.outputs.published }}
      published_sha: ${{ steps.resolve_published_release.outputs.published_sha }}

    permissions:
      contents: write
      id-token: write

    env:
      ARTICLE_PIPELINE_MAX_ARTICLES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_articles || '3' }}
      ARTICLE_MIN_BODY_CHARS: "3000"
      ARTICLE_GEMMA_REVIEW_ENABLED: "true"
      ARTICLE_GEMMA_REVIEW_PASSES: "3"
      ARTICLE_GEMMA_REVIEW_ATTEMPTS: "3"
      ARTICLE_LLM_RETRY_ATTEMPTS: "2"
      ARTICLE_LLM_RETRY_BASE_MS: "12000"
      GEMINI_MODEL_TIERS: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      GEMINI_STRATEGY_MODEL_TIERS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash
      GEMINI_WRITER_MODEL_TIERS: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      GEMINI_GEMMA_REVIEW_MODEL_TIERS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash
      GEMINI_EDITOR_MODEL_TIERS: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      GEMINI_ARTICLE_DAILY_REQUEST_LIMIT: "1040"
      GEMINI_ARTICLE_MODEL_DAILY_LIMITS: gemini-3.6-flash:20,gemini-3.5-flash:20,gemini-3.5-flash-lite:500,gemini-3.1-flash-lite:500
      KEIBA_NEWS_MAX_ORDERS_PER_RUN: "3"
      KEIBA_NEWS_MAX_TOPICS_PER_RACE_PER_RUN: "1"
      KEIBA_NEWS_MAX_QUERIES_PER_RUN: "8"
      KEIBA_NEWS_MAX_FOCUS_RACES: "12"
      KEIBA_NEWS_RACE_WINDOW_BEFORE_DAYS: "21"
      KEIBA_NEWS_RACE_WINDOW_AFTER_DAYS: "3"
      KEIBA_NEWS_RECENT_TOPIC_DEDUP_DAYS: "2"
      KEIBA_NEWS_REMOTE_SCHEDULE_ENABLED: "true"
      KEIBA_NEWS_SCHEDULE_TIMEOUT_SECONDS: "15"
      KEIBA_NEWS_REQUIRE_SCHEDULE_MATCH: "true"
      ARTICLE_PIPELINE_RESERVE_RACE_UPDATE_SLOT: "true"
      ARTICLE_PIPELINE_RESERVE_EVERGREEN_SLOT: "true"
      KEIBA_ARTICLE_COVERAGE_MODE: "aggressive"
      KEIBA_GRADE_RACE_AUTO_REPAIR_ENABLED: "true"
      KEIBA_GRADE_RACE_REPAIR_MAX_PER_RUN: "1"
      KEIBA_GRADE_RACE_REPAIR_COOLDOWN_HOURS: "48"
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:uma-free.com' }}
      KEIBA_EVERGREEN_MAX_ORDERS_PER_RUN: "1"
      KEIBA_GRADE_RACE_LEGACY_WRITER_ENABLED: "false"
      GEMINI_CIRCUIT_STATE_PATH: ${{ github.workspace }}/.runtime/gemini-article-circuit.json
      ARTICLE_GEMINI_BILLING_COOLDOWN_HOURS: "12"
      ARTICLE_GEMINI_AUTH_COOLDOWN_HOURS: "24"
      ARTICLE_GEMINI_QUOTA_COOLDOWN_HOURS: "6"
      ARTICLE_GEMINI_TRANSIENT_COOLDOWN_MINUTES: "60"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore Gemini Article Circuit State
        id: restore_gemini_circuit
        uses: actions/cache/restore@v4
        with:
          path: .runtime/gemini-article-circuit.json
          key: gemini-article-circuit-${{ github.run_id }}
          restore-keys: |
            gemini-article-circuit-

      - name: Restore Pending Article Write Orders
        uses: actions/cache/restore@v4
        with:
          path: .runtime/pending-write-orders
          key: article-pending-orders-${{ github.run_id }}
          restore-keys: |
            article-pending-orders-

      - name: Requeue Preserved Article Write Orders
        shell: bash
        run: |
          mkdir -p data/write_orders .runtime/pending-write-orders
          find .runtime/pending-write-orders -maxdepth 1 -type f -name '*.json' -exec cp -f {} data/write_orders/ \;
          restored=$(find .runtime/pending-write-orders -maxdepth 1 -type f -name '*.json' | wc -l)
          echo "- 前回から復旧した未処理WriteOrder: ${restored}件" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Gemini Article Circuit
        id: gemini_circuit
        shell: bash
        run: |
          mkdir -p "$(dirname "$GEMINI_CIRCUIT_STATE_PATH")"
          node <<'NODE'
          const fs = require('fs');
          const statePath = process.env.GEMINI_CIRCUIT_STATE_PATH;
          let state = {};
          try { state = JSON.parse(fs.readFileSync(statePath, 'utf8')); } catch {}
          const openUntil = Date.parse(state.open_until || '');
          const blocked = state.status === 'open' && Number.isFinite(openUntil) && Date.now() < openUntil;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `blocked=${blocked ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `open_until=${state.open_until || ''}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Gemini記事生成サーキット\n\n- 状態: ${blocked ? '停止中' : '実行可能'}\n- 連続失敗: ${state.consecutive_failures || 0}\n- 最終失敗種別: ${state.last_failure_kind || 'なし'}\n- 次回試行可能時刻: ${state.open_until || '制限なし'}\n\n`
          );
          if (blocked) console.log(`::warning::Gemini記事生成を停止します。次回試行可能: ${state.open_until}`);
          NODE

      - name: Preflight - Check Required Secrets
        if: steps.gemini_circuit.outputs.blocked != 'true'
        env:
          DATABASE_URL_ORIGINAL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          missing=0
          if [ -z "$DATABASE_URL_ORIGINAL" ]; then
            echo "::error::DATABASE_URL secret is required for write order generation."
            missing=1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is required for article writing and review."
            missing=1
          fi
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::warning::TAVILY_API_KEY is not set. News topic planner will skip external news collection."
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required secrets are configured."

      - name: Setup Node.js
        if: steps.gemini_circuit.outputs.blocked != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        if: steps.gemini_circuit.outputs.blocked != 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Validate Existing Article Links
        if: steps.gemini_circuit.outputs.blocked != 'true'
        working-directory: ./frontend
        run: npm run article:validate-links

      - name: Article Quality Audit
        if: steps.gemini_circuit.outputs.blocked != 'true' && (github.event_name == 'schedule' || inputs.run_quality_audit)
        working-directory: ./frontend
        run: npm run article:audit-quality

      - name: Setup Python
        if: steps.gemini_circuit.outputs.blocked != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        if: steps.gemini_circuit.outputs.blocked != 'true'
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Prepare Article Coverage Reports
        if: steps.gemini_circuit.outputs.blocked != 'true'
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/article-coverage"

      - name: Audit Grade Race Registry and Upcoming Coverage
        if: steps.gemini_circuit.outputs.blocked != 'true'
        run: >-
          python backend/scripts/agents/grade_race_registry_audit.py
          --registry frontend/content/reference/grade-race-entities.json
          --output "$RUNNER_TEMP/article-coverage/grade-race-registry.json"
          --summary "$RUNNER_TEMP/article-coverage/grade-race-registry.md"

      - name: Add Grade Race Registry Audit to Summary
        if: always() && steps.gemini_circuit.outputs.blocked != 'true'
        shell: bash
        run: cat "$RUNNER_TEMP/article-coverage/grade-race-registry.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Git
        if: steps.gemini_circuit.outputs.blocked != 'true'
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME || 'github-actions[bot]' }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

      - name: Set up IAP database tunnel
        if: steps.gemini_circuit.outputs.blocked != 'true'
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Analyze Finalized Grade Race Search Data for Repair
        id: grade_race_search_repair_monitor
        continue-on-error: true
        if: >-
          env.KEIBA_GRADE_RACE_AUTO_REPAIR_ENABLED == 'true'
          && steps.gemini_circuit.outputs.blocked != 'true'
          && (github.event.schedule == '45 7 * * *' || inputs.run_grade_race_search_repair == true)
        run: >-
          python backend/scripts/agents/grade_race_search_monitor.py
          --site-url "$GSC_SITE_URL"
          --registry frontend/content/reference/grade-race-entities.json
          --articles-dir frontend/content/articles
          --redirects frontend/content/reference/grade-race-canonical-overrides.json
          --output "$RUNNER_TEMP/article-coverage/grade-race-search.json"
          --summary "$RUNNER_TEMP/article-coverage/grade-race-search.md"

      - name: Add Grade Race Search Repair Candidates to Summary
        if: >-
          env.KEIBA_GRADE_RACE_AUTO_REPAIR_ENABLED == 'true'
          && steps.gemini_circuit.outputs.blocked != 'true'
          && (github.event.schedule == '45 7 * * *' || inputs.run_grade_race_search_repair == true)
          && steps.grade_race_search_repair_monitor.outcome == 'success'
        shell: bash
        run: cat "$RUNNER_TEMP/article-coverage/grade-race-search.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate One Grade Race Search Repair Order
        if: >-
          env.KEIBA_GRADE_RACE_AUTO_REPAIR_ENABLED == 'true'
          && steps.gemini_circuit.outputs.blocked != 'true'
          && (github.event.schedule == '45 7 * * *' || inputs.run_grade_race_search_repair == true)
          && steps.grade_race_search_repair_monitor.outcome == 'success'
        run: >-
          python backend/scripts/agents/grade_race_search_repair_planner.py
          --report "$RUNNER_TEMP/article-coverage/grade-race-search.json"
          --articles-dir frontend/content/articles
          --orders-dir data/write_orders
          --max-orders "$KEIBA_GRADE_RACE_REPAIR_MAX_PER_RUN"
          --cooldown-hours "$KEIBA_GRADE_RACE_REPAIR_COOLDOWN_HOURS"

      - name: Record Skipped Grade Race Search Repair
        if: >-
          env.KEIBA_GRADE_RACE_AUTO_REPAIR_ENABLED == 'true'
          && steps.gemini_circuit.outputs.blocked != 'true'
          && (github.event.schedule == '45 7 * * *' || inputs.run_grade_race_search_repair == true)
          && steps.grade_race_search_repair_monitor.outcome == 'failure'
        shell: bash
        run: echo "- GSC重賞検索補修はデータ取得失敗のためスキップし、通常の記事生成を継続します。" >> "$GITHUB_STEP_SUMMARY"

      - name: Step 1A - Generate News Topic Write Orders
        if: steps.gemini_circuit.outputs.blocked != 'true'
        working-directory: ./backend
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KEIBA_NEWS_MAX_ORDERS_PER_RUN: ${{ env.KEIBA_NEWS_MAX_ORDERS_PER_RUN }}
          KEIBA_NEWS_MAX_TOPICS_PER_RACE_PER_RUN: ${{ env.KEIBA_NEWS_MAX_TOPICS_PER_RACE_PER_RUN }}
          KEIBA_NEWS_MAX_QUERIES_PER_RUN: ${{ env.KEIBA_NEWS_MAX_QUERIES_PER_RUN }}
          KEIBA_NEWS_MAX_FOCUS_RACES: ${{ env.KEIBA_NEWS_MAX_FOCUS_RACES }}
          KEIBA_NEWS_LOOKBACK_DAYS: "7"
          KEIBA_NEWS_RACE_WINDOW_BEFORE_DAYS: ${{ env.KEIBA_NEWS_RACE_WINDOW_BEFORE_DAYS }}
          KEIBA_NEWS_RACE_WINDOW_AFTER_DAYS: ${{ env.KEIBA_NEWS_RACE_WINDOW_AFTER_DAYS }}
          KEIBA_NEWS_RECENT_TOPIC_DEDUP_DAYS: ${{ env.KEIBA_NEWS_RECENT_TOPIC_DEDUP_DAYS }}
          KEIBA_NEWS_REMOTE_SCHEDULE_ENABLED: ${{ env.KEIBA_NEWS_REMOTE_SCHEDULE_ENABLED }}
          KEIBA_NEWS_SCHEDULE_TIMEOUT_SECONDS: ${{ env.KEIBA_NEWS_SCHEDULE_TIMEOUT_SECONDS }}
          KEIBA_NEWS_REQUIRE_SCHEDULE_MATCH: ${{ env.KEIBA_NEWS_REQUIRE_SCHEDULE_MATCH }}
          KEIBA_NEWS_DB_ENRICH_ENABLED: "true"
        run: python scripts/agents/news_topic_planner.py

      - name: Step 1B - Generate Grade Race Write Orders
        if: steps.gemini_circuit.outputs.blocked != 'true' && env.KEIBA_GRADE_RACE_LEGACY_WRITER_ENABLED == 'true'
        working-directory: ./backend
        run: python scripts/agents/grade_race_writer.py

      - name: Step 1C - Generate Evergreen Column Write Order
        if: steps.gemini_circuit.outputs.blocked != 'true'
        working-directory: ./backend
        env:
          KEIBA_EVERGREEN_MAX_ORDERS_PER_RUN: ${{ env.KEIBA_EVERGREEN_MAX_ORDERS_PER_RUN }}
        run: python scripts/agents/editorial_evergreen_planner.py

      - name: Step 1D - Generate Statistical Write Order (Data Scientist)
        if: steps.gemini_circuit.outputs.blocked != 'true'
        working-directory: ./backend
        run: python scripts/agents/data_scientist.py

      - name: Step 2 & 3 - Generate Draft and Review
        if: steps.gemini_circuit.outputs.blocked != 'true'
        working-directory: ./frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_MODEL_TIERS: ${{ env.GEMINI_MODEL_TIERS }}
          GEMINI_STRATEGY_MODEL_TIERS: ${{ env.GEMINI_STRATEGY_MODEL_TIERS }}
          GEMINI_WRITER_MODEL_TIERS: ${{ env.GEMINI_WRITER_MODEL_TIERS }}
          GEMINI_GEMMA_REVIEW_MODEL_TIERS: ${{ env.GEMINI_GEMMA_REVIEW_MODEL_TIERS }}
          GEMINI_EDITOR_MODEL_TIERS: ${{ env.GEMINI_EDITOR_MODEL_TIERS }}
          GEMINI_ARTICLE_DAILY_REQUEST_LIMIT: ${{ env.GEMINI_ARTICLE_DAILY_REQUEST_LIMIT }}
          GEMINI_ARTICLE_MODEL_DAILY_LIMITS: ${{ env.GEMINI_ARTICLE_MODEL_DAILY_LIMITS }}
          ARTICLE_MIN_BODY_CHARS: ${{ env.ARTICLE_MIN_BODY_CHARS }}
          ARTICLE_GEMMA_REVIEW_ENABLED: ${{ env.ARTICLE_GEMMA_REVIEW_ENABLED }}
          ARTICLE_GEMMA_REVIEW_PASSES: ${{ env.ARTICLE_GEMMA_REVIEW_PASSES }}
          ARTICLE_GEMMA_REVIEW_ATTEMPTS: ${{ env.ARTICLE_GEMMA_REVIEW_ATTEMPTS }}
          ARTICLE_LLM_RETRY_ATTEMPTS: ${{ env.ARTICLE_LLM_RETRY_ATTEMPTS }}
          ARTICLE_LLM_RETRY_BASE_MS: ${{ env.ARTICLE_LLM_RETRY_BASE_MS }}
          ARTICLE_PIPELINE_MAX_ARTICLES: ${{ env.ARTICLE_PIPELINE_MAX_ARTICLES }}
          ARTICLE_PIPELINE_RESERVE_RACE_UPDATE_SLOT: ${{ env.ARTICLE_PIPELINE_RESERVE_RACE_UPDATE_SLOT }}
          ARTICLE_PIPELINE_RESERVE_EVERGREEN_SLOT: ${{ env.ARTICLE_PIPELINE_RESERVE_EVERGREEN_SLOT }}
          KEIBA_ARTICLE_COVERAGE_MODE: ${{ env.KEIBA_ARTICLE_COVERAGE_MODE }}
          KEIBA_GRADE_RACE_REPAIR_COOLDOWN_HOURS: ${{ env.KEIBA_GRADE_RACE_REPAIR_COOLDOWN_HOURS }}
          GEMINI_CIRCUIT_STATE_PATH: ${{ env.GEMINI_CIRCUIT_STATE_PATH }}
          ARTICLE_GEMINI_BILLING_COOLDOWN_HOURS: ${{ env.ARTICLE_GEMINI_BILLING_COOLDOWN_HOURS }}
          ARTICLE_GEMINI_AUTH_COOLDOWN_HOURS: ${{ env.ARTICLE_GEMINI_AUTH_COOLDOWN_HOURS }}
          ARTICLE_GEMINI_QUOTA_COOLDOWN_HOURS: ${{ env.ARTICLE_GEMINI_QUOTA_COOLDOWN_HOURS }}
          ARTICLE_GEMINI_TRANSIENT_COOLDOWN_MINUTES: ${{ env.ARTICLE_GEMINI_TRANSIENT_COOLDOWN_MINUTES }}
        run: npm run article:pipeline

      - name: Check if article was approved
        id: check_approved
        if: steps.gemini_circuit.outputs.blocked != 'true'
        run: |
          approved=$(find frontend/agents/queue/approved -name "*.md" 2>/dev/null | wc -l)
          echo "approved_count=$approved" >> $GITHUB_OUTPUT

      - name: Step 4 - Publish and Push
        if: steps.gemini_circuit.outputs.blocked != 'true' && steps.check_approved.outputs.approved_count > 0
        working-directory: ./frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run article:publish

      - name: Resolve published release
        id: resolve_published_release
        if: steps.gemini_circuit.outputs.blocked != 'true' && steps.check_approved.outputs.approved_count > 0
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_SHA="$(git rev-parse HEAD)"
          if [[ "$PUBLISHED_SHA" == "$SOURCE_SHA" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "published_sha=" >> "$GITHUB_OUTPUT"
            echo "承認済み原稿はありましたが新しいcommitは作成されませんでした。"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "published_sha=$PUBLISHED_SHA" >> "$GITHUB_OUTPUT"
            echo "Cloud Run反映対象SHA: $PUBLISHED_SHA"
          fi

      - name: Step 5 - Completion Check
        if: steps.gemini_circuit.outputs.blocked != 'true'
        run: |
          echo "Pipeline execution completed successfully!"
          echo "max_articles=${{ env.ARTICLE_PIPELINE_MAX_ARTICLES }}" >> "$GITHUB_STEP_SUMMARY"
          echo "approved_count=${{ steps.check_approved.outputs.approved_count }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Article Coverage Reports
        if: always() && steps.gemini_circuit.outputs.blocked != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: article-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/article-coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve Unprocessed Article Write Orders
        if: always()
        shell: bash
        run: |
          mkdir -p .runtime/pending-write-orders
          find .runtime/pending-write-orders -maxdepth 1 -type f -name '*.json' -delete
          if [ -d data/write_orders ]; then
            find data/write_orders -maxdepth 1 -type f -name '*.json' -exec cp -f {} .runtime/pending-write-orders/ \;
          fi
          pending=$(find .runtime/pending-write-orders -maxdepth 1 -type f -name '*.json' | wc -l)
          printf '{"schema_version":"article-pending-orders.v1","pending_count":%s,"run_id":"%s"}\n' "$pending" "$GITHUB_RUN_ID" > .runtime/pending-write-orders/manifest.txt
          echo "- 次回へ保持する未処理WriteOrder: ${pending}件" >> "$GITHUB_STEP_SUMMARY"

      - name: Save Pending Article Write Orders
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/pending-write-orders
          key: article-pending-orders-${{ github.run_id }}

      - name: Save Gemini Article Circuit State
        if: always() && hashFiles('.runtime/gemini-article-circuit.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .runtime/gemini-article-circuit.json
          key: gemini-article-circuit-${{ github.run_id }}

  deploy-frontend:
    needs: build-and-publish
    if: ${{ needs.build-and-publish.outputs.published == 'true' && vars.CLOUD_RUN_FRONTEND_AUTO_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-frontend-cloud-run.yml
    with:
      source_ref: ${{ needs.build-and-publish.outputs.published_sha }}
      disable_default_url: true
    secrets: inherit
