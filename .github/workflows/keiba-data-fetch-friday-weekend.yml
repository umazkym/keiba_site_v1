name: Keiba Data Fetch (Friday Weekend)

# 金曜日に土日分の重賞データを事前取得するワークフロー
# netkeibaの枠順確定: 金曜11:30頃（一部GIは木曜15:00頃）
# 目標: 金曜PM19:00までに土日分のデータを揃える

on:
  schedule:
    # 金曜 JST 12:00 (UTC 03:00) → 土曜分（枠順確定直後）
    - cron: '0 3 * * 5'
    # 金曜 JST 15:00 (UTC 06:00) → 日曜分
    - cron: '0 6 * * 5'
  workflow_dispatch:
    inputs:
      target_offset:
        description: '取得対象のオフセット日数 (1=明日, 2=明後日)'
        required: false
        default: '2'

permissions:
  contents: read
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Calculate target date
        id: calc_date
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_OFFSET: ${{ github.event.inputs.target_offset || '2' }}
        run: |
          set -euo pipefail
          python backend/scripts/social_video/workflow_dates.py friday-weekend \
            --event-name "$EVENT_NAME" \
            --event-schedule "$EVENT_SCHEDULE" \
            --manual-offset "$MANUAL_OFFSET" \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Run pipeline (Weekend Predictions)
        working-directory: backend
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RACE_BATCH_SIZE: '3'
          SELENIUM_PAGE_LOAD_TIMEOUT: '40'
          SELENIUM_ELEMENT_WAIT_TIMEOUT: '20'
          TZ: Asia/Tokyo
        run: |
          echo "Target date: ${{ steps.calc_date.outputs.target_date }} (offset: ${{ steps.calc_date.outputs.offset }} days)"
          python run_pipeline.py --date ${{ steps.calc_date.outputs.target_date }} --mode PREDICTIONS_ONLY
