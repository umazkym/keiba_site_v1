name: Keiba Pipeline Runner (Results)

on:
  schedule:
    # 毎日 UTC 20:00 = JST 05:00
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '処理対象日 YYYY-MM-DD'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Cache HTML files
        uses: actions/cache@v4
        with:
          path: backend/data/html_cache
          key: html-cache-${{ github.run_id }}
          restore-keys: |
            html-cache-
          save-always: true
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Resolve target date
        id: target_date
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          set -euo pipefail
          python backend/scripts/social_video/workflow_dates.py daily \
            --pipeline results \
            --event-name "$EVENT_NAME" \
            --event-schedule "$EVENT_SCHEDULE" \
            --explicit-target-date "$INPUT_TARGET_DATE" \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Record target date
        run: |
          {
            echo "## 結果反映対象日"
            echo ""
            echo "- 対象日: ${{ steps.target_date.outputs.target_date }}"
            echo "- 本来のUTC実行時刻: ${{ steps.target_date.outputs.scheduled_at_utc }}"
            echo "- 起動遅延: ${{ steps.target_date.outputs.delay_minutes }}分"
          } >> "$GITHUB_STEP_SUMMARY"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          
      - name: Run pipeline (Yesterday Results)
        working-directory: backend
        env:
          PYTHONPATH: .
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RACE_BATCH_SIZE: '3'
          SELENIUM_PAGE_LOAD_TIMEOUT: '40'
          SELENIUM_ELEMENT_WAIT_TIMEOUT: '20'
          TZ: Asia/Tokyo
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        run: |
          python run_pipeline.py --date "${{ steps.target_date.outputs.target_date }}" --mode RESULTS_ONLY
