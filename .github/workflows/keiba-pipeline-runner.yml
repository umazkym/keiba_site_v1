name: Keiba Pipeline Runner (Results)

on:
  schedule:
    # 毎日 UTC 20:00 = JST 05:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Cache HTML files
        uses: actions/cache@v4
        with:
          path: backend/data/html_cache
          key: html-cache-${{ github.run_id }}
          restore-keys: |
            html-cache-
          save-always: true
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          
      - name: Run pipeline (Yesterday Results)
        working-directory: backend
        env:
          PYTHONPATH: .
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RACE_BATCH_SIZE: '3'
          SELENIUM_PAGE_LOAD_TIMEOUT: '40'
          SELENIUM_ELEMENT_WAIT_TIMEOUT: '20'
          TZ: Asia/Tokyo
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        run: |
          python run_pipeline.py --date yesterday --mode RESULTS_ONLY
