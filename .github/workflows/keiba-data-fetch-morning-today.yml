name: Keiba Data Fetch (Morning Today)
# ★ Neon Free Tier Network Transfer 削減 (2026-04-11)
# 自動実行を廃止。retry-today (JST 10:00) に統合。
# 前日 afternoon ジョブ (JST 13:30) で当日予測は生成済みのため、
# 06:30 の早朝実行は不要。手動実行用として残す。

on:
  # schedule を削除（retry-today に統合済み）
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 初回やDBデータ不足時に全件取得（約85分）が走る可能性があるため120分に設定

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pipeline (Today Predictions)
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RACE_BATCH_SIZE: '3'
          SELENIUM_PAGE_LOAD_TIMEOUT: '40'
          SELENIUM_ELEMENT_WAIT_TIMEOUT: '20'
          TZ: Asia/Tokyo
        run: |
          python run_pipeline.py --date today --mode PREDICTIONS_ONLY
