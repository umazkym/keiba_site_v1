# render.yaml (修正版)

services:
  - type: cron
    name: keiba-pipeline-runner
    # 修正点① (必須): "Oregon" を Render 指定の "oregon" (小文字) に修正
    region: oregon
    # 修正点② (強く推奨): スケジュールを「日本時間 午前10時」である "0 1 * * *" に修正
    schedule: "0 20 * * *"
    buildFilter:
      paths:
      - backend/**
      - render.yaml
    envVars:
      - key: DATABASE_URL
        fromService:
          type: psql
          # 確認点: ご自身のDB名が "keiba-db" であることを再度ご確認ください
          name: keiba-db
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: WEBHOOK_URL
        sync: false
    buildpacks:
      - url: https://github.com/render-inc/chrome-buildpack
    rootDirectory: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_pipeline.py"