name: Setup IAP DB tunnel
description: Authenticate to Google Cloud and expose the production DB through an IAP TCP tunnel.
inputs:
  database_url:
    description: Original PostgreSQL DATABASE_URL.
    required: true
  project_id:
    description: Google Cloud project ID.
    required: false
    default: keiba-api-project
  workload_identity_provider:
    description: Workload Identity Provider resource name.
    required: false
    default: projects/761440273070/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  service_account:
    description: Google Cloud service account used by GitHub Actions.
    required: false
    default: github-actions-iap-db@keiba-api-project.iam.gserviceaccount.com
  zone:
    description: Compute Engine zone for the DB VM.
    required: false
    default: us-west1-b
  instance:
    description: Compute Engine DB VM instance name.
    required: false
    default: keiba-db
  db_port:
    description: PostgreSQL port on the DB VM.
    required: false
    default: "5432"
  local_port:
    description: Local port exposed to workflow steps.
    required: false
    default: "15432"
runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v3

    - name: Start IAP tunnel and export DATABASE_URL
      shell: bash
      env:
        DATABASE_URL_ORIGINAL: ${{ inputs.database_url }}
        PROJECT_ID: ${{ inputs.project_id }}
        ZONE: ${{ inputs.zone }}
        INSTANCE: ${{ inputs.instance }}
        DB_PORT: ${{ inputs.db_port }}
        LOCAL_PORT: ${{ inputs.local_port }}
      run: |
        set -euo pipefail

        gcloud compute start-iap-tunnel "$INSTANCE" "$DB_PORT" \
          --project="$PROJECT_ID" \
          --zone="$ZONE" \
          --local-host-port="127.0.0.1:$LOCAL_PORT" \
          --verbosity=warning > /tmp/keiba-iap-tunnel.log 2>&1 &

        for i in $(seq 1 30); do
          if timeout 2 bash -c "</dev/tcp/127.0.0.1/$LOCAL_PORT" 2>/dev/null; then
            echo "IAP tunnel is ready."
            break
          fi
          if [ "$i" = "30" ]; then
            echo "IAP tunnel failed to become ready." >&2
            cat /tmp/keiba-iap-tunnel.log >&2 || true
            exit 1
          fi
          sleep 2
        done

        python - <<'PY' >> "$GITHUB_ENV"
        import os
        import urllib.parse

        original = os.environ["DATABASE_URL_ORIGINAL"]
        local_port = os.environ["LOCAL_PORT"]
        parsed = urllib.parse.urlsplit(original)
        userinfo = parsed.netloc.rsplit("@", 1)[0] + "@" if "@" in parsed.netloc else ""
        netloc = f"{userinfo}127.0.0.1:{local_port}"
        rewritten = urllib.parse.urlunsplit((parsed.scheme, netloc, parsed.path, parsed.query, parsed.fragment))
        print(f"DATABASE_URL={rewritten}")
        PY
