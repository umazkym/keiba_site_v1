name: Keiba Data Fetch (Afternoon)
run-name: ${{ inputs.trigger == 'cloudflare' && format('{0} (定時 {1})', github.workflow, inputs.target_date) || github.workflow }}

on:
  schedule:
    # 毎日 UTC 04:30 = JST 13:30
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '処理対象日 YYYY-MM-DD'
        required: true
        type: string
      trigger:
        description: '起動元（Cloudflare の定時起動は cloudflare。手で動かすときは空のまま）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

# 予定の回と定時の起動は1本ずつ（関所が相手の結果を見られるように）。手で動かす回は並べてよい
concurrency:
  group: keiba-data-fetch-afternoon-${{ (github.event_name == 'schedule' || inputs.trigger == 'cloudflare') && 'slot' || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    # Cloudflare の定時起動（予定どおり）と GitHub の予定（おくれる・予備）が二重に動かないようにする（2026-10-25）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: backend/scripts/maintenance/workflow_dispatch_gate.py
          sparse-checkout-cone-mode: false

      - name: Check the on-time slot
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_TRIGGER: ${{ inputs.trigger }}
        run: python3 backend/scripts/maintenance/workflow_dispatch_gate.py

  run-pipeline:
    needs: gate
    # 関所が「止める」と言ったときだけ止める（関所が動けなかった日は出し損ねないように動かす）
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180  # 初回やDBデータ不足時に全件取得（約85分）が走る可能性があるため120分に設定

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Resolve target date
        id: target_date
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          set -euo pipefail
          python backend/scripts/social_video/workflow_dates.py daily \
            --pipeline afternoon \
            --event-name "$EVENT_NAME" \
            --event-schedule "$EVENT_SCHEDULE" \
            --explicit-target-date "$INPUT_TARGET_DATE" \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Record target date
        run: |
          {
            echo "## データ取得対象日"
            echo ""
            echo "- 対象日: ${{ steps.target_date.outputs.target_date }}"
            echo "- 本来のUTC実行時刻: ${{ steps.target_date.outputs.scheduled_at_utc }}"
            echo "- 起動遅延: ${{ steps.target_date.outputs.delay_minutes }}分"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Run pipeline (Tomorrow Predictions)
        working-directory: backend
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RACE_BATCH_SIZE: '3'
          SELENIUM_PAGE_LOAD_TIMEOUT: '40'
          SELENIUM_ELEMENT_WAIT_TIMEOUT: '20'
          TZ: Asia/Tokyo
        run: |
          python run_pipeline.py --date "${{ steps.target_date.outputs.target_date }}" --mode PREDICTIONS_ONLY
