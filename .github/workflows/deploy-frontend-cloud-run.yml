name: Deploy Frontend to Cloud Run

on:
  workflow_dispatch:
    inputs:
      disable_default_url:
        description: カスタムドメイン疎通後にrun.app既定URLを無効化する
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: keiba-api-project
  REGION: us-west1
  SERVICE_NAME: keiba-frontend-v1
  ARTIFACT_REPOSITORY: keiba-containers
  IMAGE_NAME: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/761440273070/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: ${{ vars.GCP_FRONTEND_DEPLOY_SERVICE_ACCOUNT || 'github-actions-cloud-run@keiba-api-project.iam.gserviceaccount.com' }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Artifact Registry
        shell: bash
        run: >-
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY"
          --project="$PROJECT_ID"
          --location="$REGION"

      - name: Create build-time public environment file
        working-directory: frontend
        env:
          REPOSITORY_VARS_JSON: ${{ toJSON(vars) }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          values = json.loads(os.environ.get("REPOSITORY_VARS_JSON") or "{}")
          public_values = {
              key: str(value)
              for key, value in values.items()
              if key.startswith("NEXT_PUBLIC_") and value is not None
          }
          public_values.setdefault("NEXT_PUBLIC_APP_RELEASE", os.environ["RELEASE_SHA"])
          target = Path(".env.production")
          target.write_text(
              "".join(
                  f"{key}={json.dumps(value, ensure_ascii=False)}\n"
                  for key, value in sorted(public_values.items())
              ),
              encoding="utf-8",
          )
          print(f"NEXT_PUBLIC環境変数を{len(public_values)}件準備しました。")
          PY

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push frontend image
        working-directory: frontend
        shell: bash
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy frontend service
        env:
          DISABLE_DEFAULT_URL: ${{ inputs.disable_default_url }}
        shell: bash
        run: |
          ENDPOINT_ARGS=(--default-url)
          if [[ "$DISABLE_DEFAULT_URL" == "true" ]]; then
            ENDPOINT_ARGS=(--no-default-url)
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE_URI" \
            --service-account="${{ vars.GCP_FRONTEND_RUNTIME_SERVICE_ACCOUNT || 'keiba-frontend-runtime@keiba-api-project.iam.gserviceaccount.com' }}" \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=40 \
            --min=0 \
            --max=2 \
            --timeout=30 \
            --cpu-throttling \
            --port=8080 \
            "${ENDPOINT_ARGS[@]}" \
            --quiet

      - name: Verify deployed health endpoint
        env:
          DISABLE_DEFAULT_URL: ${{ inputs.disable_default_url }}
          EXPECTED_RELEASE: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$DISABLE_DEFAULT_URL" == "true" ]]; then
            SERVICE_URL="https://uma-free.com"
          else
            SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          fi
          HEALTH_PAYLOAD="$(curl --fail --show-error --silent --retry 5 --retry-all-errors "$SERVICE_URL/api/health")"
          export HEALTH_PAYLOAD
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["HEALTH_PAYLOAD"])
          if payload.get("status") != "ok":
              raise SystemExit(f"health statusがokではありません: {payload!r}")
          expected = os.environ["EXPECTED_RELEASE"]
          if payload.get("release") != expected:
              raise SystemExit(
                  f"release不一致: expected={expected} actual={payload.get('release')}"
              )
          print(f"health確認成功: release={expected}")
          PY
          echo "- Verification URL: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scaling: min=0 / max=2 / concurrency=40" >> "$GITHUB_STEP_SUMMARY"
          echo "- Default run.app URL disabled: $DISABLE_DEFAULT_URL" >> "$GITHUB_STEP_SUMMARY"
