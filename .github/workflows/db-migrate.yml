name: Database Schema Migration

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: テーブル状態の確認だけを行う
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: database-schema-migration
  cancel-in-progress: false

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install migration dependencies
        run: pip install sqlalchemy psycopg2-binary python-dotenv

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}

      - name: Verify or apply publication schema
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          python backend/scripts/migrate_data_page_publications.py "${EXTRA_ARGS[@]}"
