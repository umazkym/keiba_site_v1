name: Keiba SNS Evening Post

on:
  schedule:
    # 毎日 UTC 11:00 = JST 20:00
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sns-post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up IAP database tunnel
        uses: ./.github/actions/setup-iap-db
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          
      - name: Post to SNS (Evening)
        working-directory: backend
        env:
          PYTHONPATH: .
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_EXPIRY: ${{ secrets.THREADS_TOKEN_EXPIRY }}
          SNS_THREADS_IMAGE_MODE: ${{ vars.SNS_THREADS_IMAGE_MODE || 'off' }}
          # 画像つきの投稿に付ける返信の数（つかみの一言とレースのページ。1回の実行で最初のN本まで。0で止める）
          SNS_THREADS_LINK_REPLY_MAX_PER_RUN: ${{ vars.SNS_THREADS_LINK_REPLY_MAX_PER_RUN || '1' }}
          SOCIAL_VIDEO_STAGING_GCS_BUCKET: ${{ vars.SOCIAL_VIDEO_STAGING_GCS_BUCKET }}
          SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT: ${{ vars.SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ENABLE_TWITTER: 'true'
          ENABLE_THREADS: 'true'
          THREADS_EVENING_VIDEO_REPLACES_TEXT: ${{ vars.SOCIAL_VIDEO_THREADS_MODE == 'public' }}
          FAIL_ON_SNS_ERROR: 'true'
          ALLOW_X_TRANSIENT_FAILURE_WITH_THREADS: 'true'
          TWITTER_POST_MAX_RETRIES: '3'
          TWITTER_POST_RETRY_BASE_SECONDS: '30'
          TZ: Asia/Tokyo
          RENDER: 'false'
        run: |
          python scripts/sns_poster.py --post-type evening

      # 翌日の重賞1レースのInstagramカルーセル。X・Threadsの投稿の結果に関係なく実行する。
      # 既定は validate（画像と本文を作って確かめるだけ）。公開は vars.SOCIAL_VIDEO_INSTAGRAM_CAROUSEL_MODE=public。
      - name: Instagram carousel (tomorrow's grade race)
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          PYTHONPATH: .
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SOCIAL_VIDEO_INSTAGRAM_CAROUSEL_MODE: ${{ vars.SOCIAL_VIDEO_INSTAGRAM_CAROUSEL_MODE || 'validate' }}
          SOCIAL_VIDEO_STAGING_GCS_BUCKET: ${{ vars.SOCIAL_VIDEO_STAGING_GCS_BUCKET }}
          SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT: ${{ vars.SOCIAL_VIDEO_GCS_SIGNING_SERVICE_ACCOUNT }}
          TZ: Asia/Tokyo
        run: |
          python scripts/instagram_carousel.py

      - name: Keep SNS images for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sns-images-evening
          path: sns_images_dist/
          retention-days: 3
          if-no-files-found: ignore
