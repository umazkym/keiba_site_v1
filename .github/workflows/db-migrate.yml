name: Database Migration (Render to Neon)

on: workflow_dispatch

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
      - name: Dump Data from Render
        env:
          # 今回専用の使い捨て接続文字列（実行後に削除します）
          SOURCE_DB: "postgresql://keiba_database_user:kRhHHHeIdx5Pw9LzkbA8HCLLKAg20XDm@dpg-d1gd9ajipnbc73aj1nlg-a.oregon-postgres.render.com/keiba_db"
        run: |
          echo "Starting pg_dump from Render..."
          # Ownerや権限情報は無視してデータとスキーマのみダンプ
          pg_dump -O -x $SOURCE_DB > dump.sql
          echo "Dump completed. Size:"
          ls -lh dump.sql
          
      - name: Restore Data to Neon
        env:
          TARGET_DB: "postgresql://neondb_owner:npg_0kOPvcxAU4bg@ep-hidden-fog-aksj4thi-pooler.c-3.us-west-2.aws.neon.tech/neondb?sslmode=require"
        run: |
          echo "Starting psql restore to Neon..."
          # エラーが起きても続行しつつ復元
          psql $TARGET_DB -f dump.sql
          echo "Restore completed!"
